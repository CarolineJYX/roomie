name: Deploy Roomie

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" > ~/.ssh/roomie-deploy.pem
          chmod 600 ~/.ssh/roomie-deploy.pem
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync Roomie site
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/roomie-deploy.pem" dist/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/roomie/"
          rsync -az --delete -e "ssh -i ~/.ssh/roomie-deploy.pem" server/ "$DEPLOY_USER@$DEPLOY_HOST:~/roomie-api-release/"
          rsync -az -e "ssh -i ~/.ssh/roomie-deploy.pem" deploy/ "$DEPLOY_USER@$DEPLOY_HOST:~/roomie-deploy/"

      - name: Activate Roomie API
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/roomie-deploy.pem "$DEPLOY_USER@$DEPLOY_HOST" 'sudo install -d -o ubuntu -g ubuntu /opt/roomie-api /var/lib/roomie && sudo rsync -a --delete ~/roomie-api-release/ /opt/roomie-api/ && sudo install -m 644 ~/roomie-deploy/roomie-api.service /etc/systemd/system/roomie-api.service && sudo install -m 644 ~/roomie-deploy/nginx-roomie.conf /etc/nginx/sites-available/default && sudo systemctl daemon-reload && sudo systemctl enable --now roomie-api && sudo systemctl restart roomie-api && sudo nginx -t && sudo systemctl reload nginx'
          curl --fail --retry 6 --retry-delay 2 "http://$DEPLOY_HOST/api/health"
