server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/roomie;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
